<!doctype html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simon Spel</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="wrapper">

    <h1>Simon spel</h1>

    <div class="score-container">
        <h2 class="level">
            Score: 0
        </h2>

        <p class="highscore">
            Highscore: 0
        </p>
    </div>


    <button class="start-button">
        Start spel
    </button>


    <div class="game">

        <button class="game-button yellow" value="yellow"></button>

        <button class="game-button blue" value="blue"></button>

        <button class="game-button red" value="red"></button>

        <button class="game-button green" value="green"></button>

    </div>


</div>


<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="script.js"></script>

</body>
</html>
